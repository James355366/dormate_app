# gradle/wrapper/gradle-wrapper.properties
#
# JDK <-> Gradle compatibility (max Java version each Gradle line accepts):
#   Gradle 8.11  ->  Java 8 .. 23
#   Gradle 8.14  ->  Java 8 .. 24
#   Gradle 9.1+  ->  Java 25
#
# AGP <-> Gradle compatibility:
#   AGP 8.7.x  ->  requires Gradle 8.9+  (NOT tested against Gradle 9.x)
#
# THIS PROJECT: Gradle 8.11 + AGP 8.7.3 + JDK 21
#
# IMPORTANT: set the Gradle JDK to 21, not 25.
#   Android Studio -> Settings -> Build, Execution, Deployment
#                  -> Build Tools -> Gradle -> Gradle JDK -> jbr-21
# JDK 25 would require Gradle 9.1+, which AGP 8.7.3 does not support.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
