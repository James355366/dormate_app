# ── JVM settings for the Gradle daemon ───────────────────────────────────────
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# ── Performance ──────────────────────────────────────────────────────────────
org.gradle.parallel=true
org.gradle.caching=true

# ── AndroidX (REQUIRED — the build fails without these) ──────────────────────
android.useAndroidX=true
android.enableJetifier=false

# ── Generate per-module R classes instead of one merged R ────────────────────
android.nonTransitiveRClass=true

# ── Optional: pin the Gradle JDK for everyone on the team ────────────────────
# Uncomment and point at a JDK 21 install if you don't want to rely on the
# Android Studio "Gradle JDK" setting. Windows paths need escaped backslashes.
# org.gradle.java.home=C\:\\Program Files\\Android\\Android Studio\\jbr

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# ── Override non-ASCII project path check ───────────────────────────────────
android.overridePathCheck=true
